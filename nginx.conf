server {
  listen 10000 default_server;
  listen [::]:10000 default_server;
  server_name _;
  root /app/.wasp/out/web-app/build;
  index index.html;
  charset utf-8;
  client_max_body_size 20m;

  location = /api { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location ^~ /api/ { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location = /auth { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location ^~ /auth/ { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location = /operations { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location ^~ /operations/ { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
  location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /sitemap.xml { proxy_pass http://127.0.0.1:3001/sitemap.xml; include /etc/nginx/proxy_params; }
  location = /feed.json { proxy_pass http://127.0.0.1:3001/feed.json; include /etc/nginx/proxy_params; }

  location = /models { try_files /seo-shells/models/index.html /index.html; }
  location = /benchmarks { try_files /seo-shells/benchmarks/index.html /index.html; }
  location = /scoring-system { try_files /seo-shells/scoring-system/index.html /index.html; }
  location = /methodology { try_files /seo-shells/methodology/index.html /index.html; }
  location = /sources { try_files /seo-shells/sources/index.html /index.html; }
  location = /compare { try_files /seo-shells/compare/index.html /index.html; }
  location = /articles { try_files /seo-shells/articles/index.html /index.html; }
  location = /docs { try_files /seo-shells/docs/index.html /index.html; }
  location = /docs/api { try_files /seo-shells/docs/api/index.html /index.html; }
  location = /about { try_files /seo-shells/about/index.html /index.html; }
  location = /researchers { try_files /seo-shells/researchers/index.html /index.html; }
  location = /citations { try_files /seo-shells/citations/index.html /index.html; }
  location = /reproducibility { try_files /seo-shells/reproducibility/index.html /index.html; }
  location = /people { try_files /seo-shells/people/index.html /index.html; }
  location = /labs { try_files /seo-shells/labs/index.html /index.html; }
  location = /intelligence { try_files /seo-shells/intelligence/index.html /index.html; }
  location = /agents { try_files /seo-shells/agents/index.html /index.html; }
  location = /ai-access { try_files /seo-shells/ai-access/index.html /index.html; }
  location = /free-ai { try_files /seo-shells/free-ai/index.html /index.html; }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
